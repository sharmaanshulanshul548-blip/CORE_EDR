<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORE_EDR // TELEMETRY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            background-color: #050505; 
            background-image: radial-gradient(circle at center, #1a0505 0%, #050505 100%);
            color: #e4e4e7; 
            font-family: 'JetBrains Mono', monospace; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; margin: 0; padding-top: 40px;
        }
        
        .container { width: 90%; max-width: 900px; }
        
        .top-bar { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 2px; margin-bottom: 20px; color: #a1a1aa; font-weight: bold; }
        .system-online { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
        
        .banner { 
            padding: 20px; text-align: center; font-weight: 800; font-size: 20px; letter-spacing: 4px; 
            border-radius: 8px; margin-bottom: 30px; transition: 0.3s;
        }
        .banner.safe { background: rgba(34, 197, 94, 0.05); border: 1px solid #22c55e; color: #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.1); }
        .banner.danger { background: rgba(239, 68, 68, 0.05); border: 1px solid #ef4444; color: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }

        .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; margin-bottom: 30px; }
        
        .panel { background: #111113; border: 1px solid #27272a; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel-title { font-size: 10px; color: #71717a; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        .panel-title::before { content: "● "; color: #4ade80; }
        
        .filename { font-size: 14px; word-break: break-all; margin-bottom: 30px; height: 40px; font-weight: bold;}
        .big-score { font-size: 4.5rem; font-weight: 800; color: #4ade80; line-height: 1; margin-bottom: 30px; text-shadow: 0 0 20px rgba(74, 222, 128, 0.3); transition: color 0.3s;}
        .big-score.high { color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
        .intel-report { font-size: 12px; color: #a1a1aa; }
        
        .term { background: transparent; color: #a1a1aa; font-size: 11px; line-height: 1.5; height: 200px; overflow: hidden; margin: 0; }
        .term .highlight { color: #4ade80; }
        .term .alert { color: #ef4444; font-weight: bold; }
        
        .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        
        button { 
            padding: 15px 10px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 1px;
            border-radius: 8px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; border: none;
        }
        
        .btn-canary { background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7; }
        .btn-canary:hover { background: #27272a; border-color: #52525b; }
        
        .btn-behavioral { background: #4ade80; color: #050505; box-shadow: 0 0 20px rgba(74, 222, 128, 0.2); }
        .btn-behavioral:hover { background: #22c55e; box-shadow: 0 0 30px rgba(74, 222, 128, 0.4); transform: translateY(-2px); }
        
        .btn-spyware { background: #3b82f6; color: #050505; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .btn-spyware:hover { background: #2563eb; box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); transform: translateY(-2px); }
        
        .btn-reset { background: rgba(239, 68, 68, 0.05); border: 1px solid #7f1d1d; color: #ef4444; width: 100%; font-size: 14px;}
        .btn-reset:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }

    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <span>CORE_EDR // TELEMETRY_V4</span>
            <span class="system-online">● SYSTEM_ONLINE</span>
        </div>

        <div id="banner" class="banner safe">SYSTEM SECURE // STANDBY</div>

        <div class="grid">
            <div class="panel">
                <div class="panel-title">FILE I/O MONITOR</div>
                <div id="file" class="filename">None</div>
                
                <div class="panel-title">BEHAVIORAL SCORE</div>
                <div id="ent" class="big-score">0.00</div>
                
                <div class="panel-title">INTEL REPORT</div>
                <div id="msg" class="intel-report">System idle. Monitoring I/O...</div>
            </div>

            <div class="panel">
                <div class="panel-title">KERNEL AUDIT LOGS</div>
                <pre id="term" class="term">Loading matrix...</pre>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-canary" onclick="send('/api/attack/canary')">RUN CANARY SIMULATION</button>
            <button class="btn-behavioral" onclick="send('/api/attack/behavioral')">RUN BEHAVIORAL ANALYSIS</button>
            <button class="btn-spyware" onclick="send('/api/attack/spyware')">RUN SPYWARE EXFILTRATION</button>
        </div>
        <button class="btn-reset" onclick="send('/api/stop')">SYSTEM RESET / MEMORY PURGE</button>
    </div>

    <script>
        function update() {
            fetch('/api/status').then(r => r.json()).then(data => {
                document.getElementById('file').innerText = data.last_file;
                
                const entElement = document.getElementById('ent');
                entElement.innerText = data.entropy;
                if (parseFloat(data.entropy) > 7.5) { entElement.className = "big-score high"; } 
                else { entElement.className = "big-score"; }

                document.getElementById('msg').innerText = data.message;
                
                const b = document.getElementById('banner');
                b.className = "banner " + (data.status === "DANGER" ? "danger" : "safe");
                b.innerText = data.status === "DANGER" ? "CRITICAL: THREAT NEUTRALIZED" : "SYSTEM SECURE // STANDBY";
            });

            fetch('/api/logs').then(r => r.json()).then(d => { 
                let formattedLogs = d.logs.replace(/\[!\]/g, '<span class="alert">[!]</span>');
                formattedLogs = formattedLogs.replace(/\[\*\]/g, '<span class="highlight">[*]</span>');
                formattedLogs = formattedLogs.replace(/\[!!!\]/g, '<span class="alert">[!!!]</span>');
                document.getElementById('term').innerHTML = formattedLogs; 
            });
        }
        setInterval(update, 1000);
        function send(u) { fetch(u, {method: 'POST'}); }
    </script>
</body>
</html>
